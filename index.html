        <link rel="alternate" hreflang="x-default" href="https://capsla.app/" />
        <script>
            (function () {
                try {
                    var saved = localStorage.getItem("capsla-theme");

                    if (saved === "light" || saved === "dark") {
                        document.documentElement.setAttribute("data-theme", saved);
                    }
                } catch (error) {}
            })();
        </script>
        <link rel="stylesheet" href="./styles.css" />
        <script defer src="./app.js"></script>
    </head>
    <body class="redirect-page">
        <main class="redirect-shell">
            <div class="apple-card redirect-card">
                <h1 class="hero-title">Capsla</h1>
                <p class="hero-text">Choose a language · Выберите язык · Sprache wählen</p>

                <!-- Ссылки видны всегда, а не только без скриптов. Иначе
                     поисковик и человек с медленным соединением получают
                     страницу «Redirecting…» без единого выхода с неё. -->
                <div class="noscript-links">
                    <a class="button button-primary" href="./en/">English</a>
                    <a class="button button-secondary" href="./ru/">Русский</a>
                    <a class="button button-secondary" href="./de/">Deutsch</a>
                </div>
            </div>
        </main>
